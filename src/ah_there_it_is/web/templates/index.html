{% extends "base.html" %}
{% block title %}Chat · {{ app_name }}{% endblock %}
{% block content %}
<section class="chat-shell">
  <div class="section-head">
    <div>
      <h1>Inventory chat</h1>
      <p class="muted">Text-only MVP. The current offline model understands a deliberately small command subset.</p>
    </div>
    <button id="new-conversation" class="secondary" type="button">New conversation</button>
  </div>
  <button id="load-older" class="secondary" type="button" hidden>Load older</button>
  <div id="chat-log" class="chat-log" aria-live="polite"></div>
  <form id="chat-form" class="chat-form">
    <label class="sr-only" for="message">Message</label>
    <textarea id="message" rows="2" maxlength="10000" placeholder="Положил USB тестер в правый ящик" required></textarea>
    <button type="submit">Send</button>
  </form>
  <p id="chat-status" class="muted status"></p>
</section>
{% endblock %}
{% block scripts %}<script src="/static/chat.js" defer></script>{% endblock %}
