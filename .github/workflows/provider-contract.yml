name: provider-contract

permissions:
  contents: read

'on':
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      provider:
        description: Real provider to probe
        required: true
        default: groq
        type: choice
        options:
          - groq
          - gemini
      probe_case:
        description: Optional single model-probe case id
        required: false
        default: ''
        type: string

jobs:
  adapter-contract:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - uses: extractions/setup-just@v4
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[test]'
      - run: just provider-contract

  model-probe-groq:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.provider == 'groq' }}
    environment: live-llm-test
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -e '.[test]'
      - name: Probe Groq model contract
        env:
          AH_THERE_IT_IS_LLM_PROVIDER: openai-compatible
          AH_THERE_IT_IS_LLM_PROVIDER_NAME: groq
          AH_THERE_IT_IS_LLM_BASE_URL: ${{ vars.GROQ_BASE_URL || 'https://api.groq.com/openai/v1' }}
          AH_THERE_IT_IS_LLM_MODEL: ${{ vars.GROQ_MODEL || 'qwen/qwen3.8-27b' }}
          AH_THERE_IT_IS_LLM_API_KEY: ${{ secrets.GROQ_API_KEY }}
          AH_THERE_IT_IS_LLM_TIMEOUT_SECONDS: '30'
          AH_THERE_IT_IS_LLM_MAX_RETRIES: '1'
          AH_THERE_IT_IS_LLM_RETRY_BACKOFF_SECONDS: '1'
          AH_THERE_IT_IS_LLM_TEMPERATURE: '0.2'
          AH_THERE_IT_IS_LLM_EXTRA_BODY_JSON: '{"max_completion_tokens":256,"reasoning_effort":"none","reasoning_format":"hidden"}'
        run: |
          CASE_ARGS=()
          if [ -n "${{ inputs.probe_case }}" ]; then
            CASE_ARGS=(--case "${{ inputs.probe_case }}")
          fi
          python -m ah_there_it_is.model_probe \
            --suite eval/model-probes-v1.json \
            "${CASE_ARGS[@]}" \
            --output model-probe.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: model-probe-groq
          path: model-probe.json
          if-no-files-found: ignore

  model-probe-gemini:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.provider == 'gemini' }}
    environment: live-llm-test
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -e '.[test]'
      - name: Probe Gemini model contract
        env:
          AH_THERE_IT_IS_LLM_PROVIDER: gemini
          AH_THERE_IT_IS_LLM_PROVIDER_NAME: gemini
          AH_THERE_IT_IS_LLM_BASE_URL: ${{ vars.GEMINI_BASE_URL || 'https://generativelanguage.googleapis.com/v1beta' }}
          AH_THERE_IT_IS_LLM_MODEL: ${{ vars.GEMINI_MODEL || 'gemini-flash-latest' }}
          AH_THERE_IT_IS_LLM_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          AH_THERE_IT_IS_LLM_TIMEOUT_SECONDS: '30'
          AH_THERE_IT_IS_LLM_MAX_RETRIES: '1'
        run: |
          CASE_ARGS=()
          if [ -n "${{ inputs.probe_case }}" ]; then
            CASE_ARGS=(--case "${{ inputs.probe_case }}")
          fi
          python -m ah_there_it_is.model_probe \
            --suite eval/model-probes-v1.json \
            "${CASE_ARGS[@]}" \
            --output model-probe.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: model-probe-gemini
          path: model-probe.json
          if-no-files-found: ignore
