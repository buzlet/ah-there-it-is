name: sandbox-offline-bundle

permissions:
  contents: read

'on':
  push:
    branches:
      - sandbox/offline-test-bundle
  workflow_dispatch:

jobs:
  wheelhouse:
    name: wheelhouse-py${{ matrix.python }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python:
          - '3.12'
          - '3.13'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Build complete offline wheelhouse
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          mkdir -p wheelhouse
          python -m pip wheel             --wheel-dir wheelhouse             '.[test]'             'coverage>=7,<8'

          test -n "$(find wheelhouse -maxdepth 1 -type f -name '*.whl' -print -quit)"
          if find wheelhouse -maxdepth 1 -type f ! -name '*.whl' -print -quit | grep -q .; then
            echo "wheelhouse contains non-wheel files" >&2
            find wheelhouse -maxdepth 1 -type f -printf '%f\n' >&2
            exit 1
          fi

          python - <<'PY'
          from pathlib import Path
          import hashlib
          for path in sorted(Path("wheelhouse").glob("*.whl")):
              digest = hashlib.sha256(path.read_bytes()).hexdigest()
              print(f"{digest}  {path.name}")
          PY

      - name: Prove wheelhouse installs fully offline
        shell: bash
        run: |
          set -euo pipefail
          version="$(python - <<'PY'
          import tomllib
          with open("pyproject.toml", "rb") as handle:
              print(tomllib.load(handle)["project"]["version"])
          PY
          )"
          python -m venv offline-smoke
          offline-smoke/bin/python -m pip install             --no-index             --find-links=wheelhouse             "ah-there-it-is[test]==$version"             'coverage>=7,<8'
          PYTHONPATH=src offline-smoke/bin/python -m pytest -q

      - uses: actions/upload-artifact@v4
        with:
          name: wheelhouse-py${{ matrix.python }}
          path: wheelhouse/
          if-no-files-found: error
          retention-days: 30

  bundle:
    name: assemble-sandbox-bundle
    needs:
      - wheelhouse
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: extractions/setup-just@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - uses: actions/download-artifact@v4
        with:
          name: wheelhouse-py3.12
          path: bundle/wheelhouse/py312

      - uses: actions/download-artifact@v4
        with:
          name: wheelhouse-py3.13
          path: bundle/wheelhouse/py313

      - name: Assemble tracked source snapshot
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p bundle/source bundle/bin

          git archive HEAD | tar -x -C bundle/source

          cp "$(command -v just)" bundle/bin/just
          chmod 0755 bundle/bin/just

          cp tools/sandbox/bootstrap_offline.sh bundle/bootstrap-sandbox.sh
          chmod 0755 bundle/bootstrap-sandbox.sh

          {
            echo "repository=buzlet/ah-there-it-is"
            echo "commit=$(git rev-parse HEAD)"
            echo "runner_arch=$(uname -m)"
            echo "just=$(bundle/bin/just --version)"
            echo "python313=$(python --version 2>&1)"
          } > bundle/MANIFEST.txt

          (
            cd bundle
            find source wheelhouse bin -type f -print0               | sort -z               | xargs -0 sha256sum
          ) > bundle/SHA256SUMS

      - name: Sandbox-like offline smoke
        shell: bash
        run: |
          set -euo pipefail
          (
            cd bundle
            ./bootstrap-sandbox.sh --python python3.13
            cd source
            ../bin/just compile
            .venv/bin/python -m pytest -q
          )

      - name: Pack bundle
        shell: bash
        run: |
          set -euo pipefail
          tar -C bundle -czf ah-there-it-is-sandbox-bundle.tar.gz .
          sha256sum ah-there-it-is-sandbox-bundle.tar.gz             > ah-there-it-is-sandbox-bundle.tar.gz.sha256
          ls -lh ah-there-it-is-sandbox-bundle.tar.gz

      - uses: actions/upload-artifact@v4
        with:
          name: ah-there-it-is-sandbox-bundle
          path: |
            ah-there-it-is-sandbox-bundle.tar.gz
            ah-there-it-is-sandbox-bundle.tar.gz.sha256
          if-no-files-found: error
          retention-days: 30
