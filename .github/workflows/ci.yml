name: application-ci

permissions:
  contents: read

'on':
  pull_request:
    paths-ignore:
      - 'agent-tasks/archive/**'
  push:
    branches:
      - main

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install test tooling
        run: python -m pip install -e '.[test]' 'wheel>=0.45,<1'
      - run: make PYTHON=python compile
      - name: Parallel fast tests
        run: make PYTHON=python TEST_WORKERS=4 test-fast-parallel
      - run: make PYTHON=python migration-check
      - run: make PYTHON=python corpus-check
      - run: make PYTHON=python scenario-check
      - name: Retrieval evaluation
        run: make PYTHON=python retrieval-eval

  sandbox-bundle:
    runs-on: ubuntu-24.04
    env:
      SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 1

      - name: Assemble compact sandbox source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p sandbox-bundle/.sandbox

          cp -a src tests eval prompts sandbox-bundle/
          mkdir -p sandbox-bundle/tools
          cp -a tools/agent tools/sandbox sandbox-bundle/tools/
          mkdir -p sandbox-bundle/agent-tasks
          for directory in common designs planning batches assignments reviews executors; do
            if [ -d "agent-tasks/$directory" ]; then
              cp -a "agent-tasks/$directory" sandbox-bundle/agent-tasks/
            fi
          done

          for file in Makefile pyproject.toml alembic.ini README.md AGENTS.md HANDOFF.md PROJECT-MODULE-MAP.md .env.example .gitignore; do
            if [ -e "$file" ]; then
              cp -a "$file" sandbox-bundle/
            fi
          done

      - name: Bind artifact to exact upstream source
        shell: bash
        run: |
          set -euo pipefail

          cat > sandbox-bundle/.sandbox/MANIFEST.txt <<EOF_MANIFEST
          repository=buzlet/ah-there-it-is
          source_commit=$SOURCE_SHA
          run_id=$GITHUB_RUN_ID
          run_number=$GITHUB_RUN_NUMBER
          ref=$GITHUB_REF
          ref_name=$GITHUB_REF_NAME
          event=$GITHUB_EVENT_NAME
          runner_arch=$(uname -m)
          sandbox_python=3.13
          EOF_MANIFEST

          (
            cd sandbox-bundle
            make help >/dev/null
          )

      - name: Verify v9 executor profiles are bundled
        shell: bash
        run: |
          set -euo pipefail
          test -f sandbox-bundle/agent-tasks/executors/chatgpt-sandbox.md

      - name: Report bundle size
        shell: bash
        run: |
          set -euo pipefail
          du -sh sandbox-bundle
          du -sh sandbox-bundle/.sandbox sandbox-bundle/src sandbox-bundle/tests sandbox-bundle/agent-tasks/executors

      - uses: actions/upload-artifact@v4
        with:
          name: sandbox-bundle-${{ env.SOURCE_SHA }}
          path: sandbox-bundle/
          if-no-files-found: error
          retention-days: 5
          compression-level: 9
          include-hidden-files: true
