name: application-ci

permissions:
  contents: read

'on':
  pull_request:
    paths-ignore:
      - 'AGENTS.md'
      - 'HANDOFF.md'
      - 'README.md'
      - 'agent-tasks/**'

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - uses: extractions/setup-just@v4
      - run: python -m pip install -e '.[test]'
      - run: just check
      - run: just migration-check
      - run: just corpus-check
      - run: just scenario-check
      - run: just scenario-eval eval/corpus-v1.json eval/scenarios-v1.json scenario-eval.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: application-scenario-report
          path: scenario-eval.json
          if-no-files-found: warn
