name: application-ci

permissions:
  contents: read

'on':
  pull_request:
    paths-ignore:
      - 'agent-tasks/archive/**'
  push:
    branches:
      - main

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -e '.[test]'
      - name: Install CI-only verification and wheel tooling
        run: python -m pip install 'coverage>=7,<8' 'wheel>=0.45,<1'
      - run: make PYTHON=python compile
      - name: Tests with coverage
        run: |
          python -m coverage run --branch --source=ah_there_it_is -m pytest
          python -m coverage report --show-missing --precision=2 --fail-under=83.00
      - run: make PYTHON=python migration-check
      - run: make PYTHON=python corpus-check
      - run: make PYTHON=python scenario-check
      - run: make PYTHON=python scenario-eval > scenario-eval.json
      - name: Retrieval evaluation
        run: |
          make PYTHON=python retrieval-eval | tee retrieval-eval.log
          report_path="$(sed -n 's/^report: //p' retrieval-eval.log | tail -n 1)"
          test -n "$report_path"
          cp "$report_path" retrieval-eval.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: application-evaluation-reports-${{ github.sha }}
          path: |
            scenario-eval.json
            retrieval-eval.json
          if-no-files-found: warn
          retention-days: 5

  sandbox-bundle:
    runs-on: ubuntu-24.04
    env:
      SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 1

      - name: Assemble compact sandbox source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p sandbox-bundle/.sandbox

          cp -a src tests eval prompts sandbox-bundle/
          mkdir -p sandbox-bundle/tools
          cp -a tools/agent tools/sandbox sandbox-bundle/tools/
          mkdir -p sandbox-bundle/agent-tasks
          for directory in common designs planning batches assignments reviews; do
            if [ -d "agent-tasks/$directory" ]; then
              cp -a "agent-tasks/$directory" sandbox-bundle/agent-tasks/
            fi
          done

          for file in Makefile pyproject.toml alembic.ini README.md AGENTS.md HANDOFF.md PROJECT-MODULE-MAP.md .env.example .gitignore; do
            if [ -e "$file" ]; then
              cp -a "$file" sandbox-bundle/
            fi
          done

      - name: Bind artifact to exact upstream source
        shell: bash
        run: |
          set -euo pipefail

          cat > sandbox-bundle/.sandbox/MANIFEST.txt <<EOF
          repository=buzlet/ah-there-it-is
          source_commit=$SOURCE_SHA
          run_id=$GITHUB_RUN_ID
          run_number=$GITHUB_RUN_NUMBER
          ref=$GITHUB_REF
          ref_name=$GITHUB_REF_NAME
          event=$GITHUB_EVENT_NAME
          runner_arch=$(uname -m)
          sandbox_python=3.13
          EOF

          (
            cd sandbox-bundle
            make help >/dev/null
          )

      - name: Report bundle size
        shell: bash
        run: |
          set -euo pipefail
          du -sh sandbox-bundle
          du -sh sandbox-bundle/.sandbox sandbox-bundle/src sandbox-bundle/tests

      - uses: actions/upload-artifact@v4
        with:
          name: sandbox-bundle-${{ env.SOURCE_SHA }}
          path: sandbox-bundle/
          if-no-files-found: error
          retention-days: 5
          compression-level: 9
          include-hidden-files: true
