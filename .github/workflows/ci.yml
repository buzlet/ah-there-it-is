name: ci

permissions:
  contents: read

'on':
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      provider:
        description: Live LLM provider
        required: true
        default: groq
        type: choice
        options:
          - groq
          - gemini
      suite:
        description: Live evaluation suite
        required: true
        default: smoke
        type: choice
        options:
          - smoke
          - tool-discipline
          - representative
      prompt_variant:
        description: System prompt variant
        required: true
        default: v1
        type: choice
        options:
          - v1
          - v2-strict

jobs:
  test:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python-version: ['3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - uses: extractions/setup-just@v4
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[test]'
      - run: just check
      - run: just migration-check
      - run: just corpus-check

  live-gemini-smoke:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.provider == 'gemini' }}
    environment: live-llm-test
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -e '.[test]'
      - name: Run bounded live Gemini evaluation when configured
        env:
          AH_THERE_IT_IS_LLM_PROVIDER: ${{ vars.LLM_PROVIDER || 'gemini' }}
          AH_THERE_IT_IS_LLM_PROVIDER_NAME: gemini
          AH_THERE_IT_IS_LLM_BASE_URL: ${{ vars.GEMINI_BASE_URL || 'https://generativelanguage.googleapis.com/v1beta' }}
          AH_THERE_IT_IS_LLM_MODEL: ${{ vars.GEMINI_MODEL || 'gemini-flash-latest' }}
          AH_THERE_IT_IS_LLM_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          AH_THERE_IT_IS_LLM_TIMEOUT_SECONDS: '30'
          AH_THERE_IT_IS_LLM_MAX_RETRIES: '2'
          AH_THERE_IT_IS_LLM_RETRY_BACKOFF_SECONDS: '1'
        run: |
          if [ -z "$AH_THERE_IT_IS_LLM_API_KEY" ]; then
            echo "Live Gemini evaluation skipped: configure GEMINI_API_KEY in environment live-llm-test."
            exit 0
          fi
          if [ "${{ inputs.suite }}" = "representative" ]; then
            CASES=(
              --case find-01
              --case move-01
              --case create-01
              --case ambiguity-01
              --case history-01
            )
          elif [ "${{ inputs.suite }}" = "tool-discipline" ]; then
            CASES=(--case find-01 --case create-01 --case ambiguity-01)
          else
            CASES=(--case find-01 --case move-01)
          fi
          if [ "${{ inputs.prompt_variant }}" = "v2-strict" ]; then
            PROMPT_ARGS=(--prompt prompts/inventory-v2-strict.txt --version inventory-v2-strict)
          else
            PROMPT_ARGS=(--prompt prompts/inventory-v1.txt --version inventory-v1)
          fi
          python -m ah_there_it_is.live_eval \
            --corpus eval/corpus-v1.json \
            "${CASES[@]}" \
            "${PROMPT_ARGS[@]}" \
            --output live-eval.json
      - name: Upload live evaluation report
        if: ${{ always() && github.event_name == 'workflow_dispatch' }}
        uses: actions/upload-artifact@v4
        with:
          name: live-eval-report-gemini-${{ inputs.prompt_variant }}
          path: live-eval.json
          if-no-files-found: ignore

  live-groq-smoke:
    if: ${{ (github.event_name == 'workflow_dispatch' && inputs.provider == 'groq') || github.ref == 'refs/heads/feat/stage6-deterministic-benchmark' }}
    environment: live-llm-test
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -e '.[test]'
      - name: Run bounded live Groq evaluation when configured
        env:
          AH_THERE_IT_IS_LLM_PROVIDER: openai-compatible
          AH_THERE_IT_IS_LLM_PROVIDER_NAME: groq
          AH_THERE_IT_IS_LLM_BASE_URL: ${{ vars.GROQ_BASE_URL || 'https://api.groq.com/openai/v1' }}
          AH_THERE_IT_IS_LLM_MODEL: ${{ vars.GROQ_MODEL || 'qwen/qwen3.8-27b' }}
          AH_THERE_IT_IS_LLM_API_KEY: ${{ secrets.GROQ_API_KEY }}
          AH_THERE_IT_IS_LLM_TIMEOUT_SECONDS: '30'
          AH_THERE_IT_IS_LLM_MAX_RETRIES: '2'
          AH_THERE_IT_IS_LLM_RETRY_BACKOFF_SECONDS: '1'
          AH_THERE_IT_IS_LLM_TEMPERATURE: '0.2'
          AH_THERE_IT_IS_LLM_EXTRA_BODY_JSON: '{"max_completion_tokens":256,"top_p":0.95,"reasoning_effort":"none","reasoning_format":"hidden","seed":424242,"disable_tool_validation":true}'
        run: |
          if [ -z "$AH_THERE_IT_IS_LLM_API_KEY" ]; then
            echo "Live Groq evaluation skipped: configure GROQ_API_KEY in environment live-llm-test."
            exit 0
          fi
          if [ "$GITHUB_REF" = "refs/heads/feat/stage6-deterministic-benchmark" ]; then
            CASES=(--case find-01 --case create-01 --case ambiguity-01)
          elif [ "${{ inputs.suite }}" = "representative" ]; then
            CASES=(
              --case find-01
              --case move-01
              --case create-01
              --case ambiguity-01
              --case history-01
            )
          elif [ "${{ inputs.suite }}" = "tool-discipline" ]; then
            CASES=(--case find-01 --case create-01 --case ambiguity-01)
          else
            CASES=(--case find-01 --case move-01)
          fi
          if [ "$GITHUB_REF" = "refs/heads/feat/stage6-deterministic-benchmark" ]; then
            PROMPT_ARGS=(--prompt prompts/inventory-v1.txt --version inventory-v1)
          elif [ "${{ inputs.prompt_variant }}" = "v2-strict" ]; then
            PROMPT_ARGS=(--prompt prompts/inventory-v2-strict.txt --version inventory-v2-strict)
          else
            PROMPT_ARGS=(--prompt prompts/inventory-v1.txt --version inventory-v1)
          fi
          python -m ah_there_it_is.live_eval \
            --corpus eval/corpus-v1.json \
            "${CASES[@]}" \
            "${PROMPT_ARGS[@]}" \
            --output live-eval.json
      - name: Upload live evaluation report
        if: ${{ always() && (github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/feat/stage6-deterministic-benchmark') }}
        uses: actions/upload-artifact@v4
        with:
          name: live-eval-report-groq-${{ inputs.prompt_variant || 'v1' }}
          path: live-eval.json
          if-no-files-found: ignore
