name: ci

permissions:
  contents: read

'on':
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python-version: ['3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - uses: extractions/setup-just@v4
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[test]'
      - run: just check
      - run: just migration-check
      - run: just corpus-check

  live-gemini-smoke:
    if: ${{ github.event_name == 'workflow_dispatch' }}
    environment: live-llm-test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -e '.[test]'
      - name: Run live Gemini provider smoke when configured
        env:
          AH_THERE_IT_IS_LLM_PROVIDER: gemini
          AH_THERE_IT_IS_LLM_PROVIDER_NAME: gemini
          AH_THERE_IT_IS_LLM_MODEL: ${{ vars.GEMINI_MODEL || 'gemini-flash-latest' }}
          AH_THERE_IT_IS_LLM_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          if [ -z "$AH_THERE_IT_IS_LLM_API_KEY" ]; then
            echo "Live Gemini smoke skipped: configure GEMINI_API_KEY in environment live-llm-test."
            exit 0
          fi
          python -m ah_there_it_is.provider_smoke
          python -m ah_there_it_is.live_eval --corpus eval/corpus-v1.json --limit 5 --output live-eval.json
      - name: Upload live evaluation report
        if: ${{ always() && github.event_name == 'workflow_dispatch' }}
        uses: actions/upload-artifact@v4
        with:
          name: live-eval-report
          path: live-eval.json
          if-no-files-found: ignore
