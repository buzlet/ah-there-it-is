name: application-extended-ci

permissions:
  contents: read

'on':
  workflow_dispatch:

jobs:
  verify-extended:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Bind run to exact dispatch SHA
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          echo "extended verification SHA: $GITHUB_SHA"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install test tooling
        run: python -m pip install -e '.[test]' 'coverage>=7,<8' 'wheel>=0.45,<1'
      - run: make PYTHON=python compile
      - name: Complete test suite with branch coverage
        run: make PYTHON=python test-extended-coverage
      - run: make PYTHON=python migration-check
      - run: make PYTHON=python corpus-check
      - run: make PYTHON=python scenario-check
      - name: Full scenario evaluation
        run: make PYTHON=python scenario-eval > scenario-eval.json
      - name: Retrieval evaluation
        run: |
          make PYTHON=python retrieval-eval | tee retrieval-eval.log
          report_path="$(sed -n 's/^report: //p' retrieval-eval.log | tail -n 1)"
          test -n "$report_path"
          cp "$report_path" retrieval-eval.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: extended-evaluation-reports-${{ github.sha }}
          path: |
            scenario-eval.json
            retrieval-eval.json
          if-no-files-found: warn
          retention-days: 5
